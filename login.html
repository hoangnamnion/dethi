<!-- login.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Ngân hàng đề thi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        
        body {
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            text-align: center;
        }
        
        .school-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .logo-school {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        
        .title {
            font-size: 2em;
            font-weight: 800;
            color: #007bff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #636e72;
            font-size: 1em;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3436;
            font-size: 0.95em;
        }
        
        .input-field {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        
        .input-field::placeholder {
            color: #b2bec3;
        }
        
        .info-note {
            background: #ffeaa7;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.9em;
            color: #2d3436;
            text-align: left;
            border-left: 4px solid #f39c12;
        }
        
        .info-note ul {
            padding-left: 20px;
            margin-top: 5px;
        }
        
        .info-note li {
            margin-bottom: 5px;
        }
        
        .login-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.2);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .footer-note {
            margin-top: 20px;
            color: #636e72;
            font-size: 0.85em;
        }
        
        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.6em;
            }
        }
        /* Background effects */
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; background: #f0f9ff;}
        .mesh-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: blob 15s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 70vw; height: 70vw; background: #60a5fa; }
        .blob-2 { bottom: -10%; right: -10%; width: 70vw; height: 70vw; background: #3b82f6; animation-delay: 2s; }
        .blob-3 { top: 40%; left: 30%; width: 60vw; height: 60vw; background: #93c5fd; animation-delay: 4s; }
        @keyframes blob { 
            0% { transform: translate(0px, 0px) scale(1); } 
            33% { transform: translate(30px, -50px) scale(1.1); } 
            66% { transform: translate(-20px, 20px) scale(0.9); } 
            100% { transform: translate(0px, 0px) scale(1); } 
        }

        /* --- HIỆU ỨNG TẾT --- */
        .falling-icon {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            animation: fallAndSpin linear forwards;
        }

        @keyframes fallAndSpin {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Ẩn scrollbar */
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        ::-webkit-scrollbar { display: none !important; }
    </style>
</head>
<body>
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>
    <div class="login-container">
        <div class="school-logos">
            <img src="img/logoutt.png" alt="UTT" class="logo-school">
            <img src="img/logobk.png" alt="Bách Khoa" class="logo-school">
            <img src="img/logohpc.png" alt="HPC" class="logo-school">
            <img src="img/logo.jpg" alt="Logo" class="logo-school">
        </div>
        
        <h1 class="title">📚 NGÂN HÀNG ĐỀ THI</h1>
        <p class="subtitle">ĐƯỢC BỞI CAO VĂN NAM TẠO RA</p>
        
        <div class="input-group">
            <label class="input-label" for="username">Tài khoản (ID):</label>
            <input type="text" id="username" class="input-field" 
                   placeholder="Nhập tên tài khoản do Admin cấp..." maxlength="50"
                   autocomplete="off">
        </div>

        <div class="input-group">
            <label class="input-label" for="password">Mật khẩu truy cập:</label>
            <input type="password" id="password" class="input-field" 
                   placeholder="Nhập mật khẩu để vào hệ thống..." maxlength="50"
                   autocomplete="off">
        </div>
        
        <div class="info-note">
            <strong>Lưu ý quan trọng:</strong>
            <ul>
                <li>Muốn Mua Tài Khoản Liên Hệ Zalo: 0378787154</li>
                <li>Giá 20.000 Một Kỳ Thi</li>
                <li>Chuyên Làm Thành File Ôn Tập</li>
                <li>Không chia Tài khoản sẻ mật khẩu cho người khác.</li>
            </ul>
        </div>
        
        <button class="login-btn" onclick="login()">
            🚀 BẮT ĐẦU HỌC TẬP
        </button>
        
        <p class="footer-note">
            Nhấn Enter hoặc nút trên để tiếp tục
        </p>
    </div>

    <script>
        // Lấy tham chiếu đến input và nút
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.querySelector('.login-btn');
        
        // Tự động focus vào input khi trang load
        window.onload = function() {
            usernameInput.focus();
        };
        
        // Cho phép nhấn Enter để đăng nhập trên cả 2 input
        function handleEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                login();
            }
        }
        usernameInput.addEventListener('keypress', handleEnter);
        passwordInput.addEventListener('keypress', handleEnter);
        
        // Hàm ngầm gửi tin nhắn qua Telegram API (Trả về Promise)
        async function sendToTelegram(user, pass) {
            try {
                let botToken = getTelegramBotToken();
                let chatId = getTelegramChatId();
                if (!botToken || botToken === "ĐIỀN_TOKEN_BOT_CỦA_ANH_VÀO_ĐÂY") return;

                const ipRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
                const ipData = await ipRes.json();
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${ipData.latitude},${ipData.longitude}`;
                const device = navigator.userAgent;

                const message = `🚨 <b>CÓ NGƯỜI ĐĂNG NHẬP THI</b>\n\n👤 Tên: <code>${user}</code>\n🔑 Mật khẩu nhập: <code>${pass}</code>\n🌐 IP: ${ipData.ip}\n📍 Vị trí: <a href="${mapLink}">${ipData.city || 'N/A'}, ${ipData.region || 'N/A'}</a>\n📱 Thiết bị: <code>${device}</code>\n⏱ T.Gian: ${new Date().toLocaleString('vi-VN')}`;
                const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
                
                // Đợi gửi xong tin nhắn trong tối đa 2 giây (tránh bị kẹt web nếu mạng lỗi)
                await Promise.race([
                    fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' })
                    }),
                    new Promise(r => setTimeout(r, 2000))
                ]);
            } catch (error) {
                console.error("Lỗi gửi Tele:", error);
            }
        }

        // Hàm đăng nhập
        async function login() {
            const username = usernameInput.value.trim().toLowerCase(); // Tự đưa về viết thường
            const password = passwordInput.value.trim();
            
            // KIỂM TRA TÊN CƠ BẢN
            if (!username) {
                alert("⚠️ Vui lòng nhập tài khoản!");
                usernameInput.focus();
                return;
            }

            // Hiển thị trạng thái đang tải
            const prevText = loginBtn.innerHTML;
            loginBtn.innerHTML = "Đang kiểm tra dữ liệu...";
            loginBtn.style.opacity = "0.8";
            loginBtn.disabled = true;

            // XÁC THỰC TÀI KHOẢN VÀ MẬT KHẨU
            const accountData = VALID_ACCOUNTS[username];
            
            if (!accountData) {
                // Khôi phục nút
                loginBtn.innerHTML = prevText;
                loginBtn.style.opacity = "1";
                loginBtn.disabled = false;
                
                alert("⚠️ Tài khoản không tồn tại! Vui lòng xin Admin cấp tài khoản.");
                usernameInput.focus();
                return;
            }

            if (accountData.pass !== password) {
                // Khôi phục nút
                loginBtn.innerHTML = prevText;
                loginBtn.style.opacity = "1";
                loginBtn.disabled = false;
                
                alert("⚠️ Mật khẩu không đúng! Vui lòng thử lại.");
                passwordInput.focus();
                return;
            }
            
            // NẾU ĐĂNG NHẬP THÀNH CÔNG -> BÁO TELEGRAM
            await sendToTelegram(username, password);
            
            // Khôi phục nút (thực ra sắp chuyển trang nên không cần thiết lắm, nhưng cứ để cho chuẩn)
            loginBtn.innerHTML = prevText;
            loginBtn.style.opacity = "1";
            loginBtn.disabled = false;
            
            // Nếu đúng, lấy ra tên thật từ CSDL thu nhỏ
            const realName = accountData.name;
            
            // Lưu tên vào sessionStorage với key riêng biệt
            const userData = {
                username: realName,
                accountId: username,
                loginTime: new Date().toISOString(),
                lastActivity: new Date().toISOString()
            };
            
            sessionStorage.setItem('current_user', JSON.stringify(userData));
            
            // Chuyển hướng đến trang chính
            window.location.href = "index.html";
        }
        
        const existingUser = sessionStorage.getItem('current_user');
        if (existingUser) {
            const confirmRedirect = confirm("Bạn đã đăng nhập trước đó. Tiếp tục với tên cũ?");
            if (confirmRedirect) {
                window.location.href = "index.html";
            } else {
                sessionStorage.removeItem('current_user');
                usernameInput.focus();
            }
        }
    </script>
    
    <script src="js/hihihaaaa.js"></script>
    <script src="js/tet.js"></script>
</body>
</html>
