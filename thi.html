<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Làm Bài Thi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/thi-premium.css">
    <style>
        body.low-graphics .mesh-bg { display: none !important; }
        body.low-graphics .falling-icon { display: none !important; }
        body.low-graphics canvas { display: none !important; }
        body.low-graphics * { animation: none !important; transition: none !important; }
        body.low-graphics { background: #f0f4f8 !important; }
    </style>
</head>

<body>
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>
    <div class="app-full">
        <!-- ====== HEADER ====== -->
        <div class="header exam-header">
            <button class="home-btn" onclick="goBack()" title="Quay lại">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>

            <div class="header-center">
                <div class="header-title" id="sectionTitle">Loading...</div>
                <div class="header-timer" id="timer">⏱ 00:00</div>
            </div>

            <div class="header-actions">
                <button class="icon-btn" onclick="resetExam()" title="Làm lại từ đầu">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                </button>
                <button class="submit-btn-new" onclick="finishExam()">
                    Nộp bài
                </button>
            </div>
        </div>

        <!-- ====== CONTENT ====== -->
        <div class="content">
            <div class="toolbar-row">
                <button class="chip-btn danger" id="btnLowGraphics" onclick="toggleLowGraphics()" title="Tắt bớt hiệu ứng">
                    ⚡ Hiệu ứng
                </button>
            </div>
            <div id="loading" style="text-align:center; margin-top:30px">Đang tải câu hỏi...</div>
            <div id="quizArea" style="display:none">
                <div class="q-number-row" id="qNumber"></div>
                <div class="question-text" id="qText"></div>
                <div class="options-grid" id="optionsArea"></div>
            </div>
        </div>

        <!-- ====== FOOTER ====== -->
        <div class="footer exam-footer">
            <button class="footer-btn menu-btn-footer" onclick="toggleModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <button class="footer-btn nav-prev" id="btnPrev" onclick="changeQuestion(-1)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Trước
            </button>
            <button class="footer-btn nav-next" id="btnNext" onclick="changeQuestion(1)">
                Tiếp
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- ====== MODAL: QUESTION LIST ====== -->
        <div class="modal" id="modalList">
            <div class="modal-header">
                <h3>📋 Danh sách câu hỏi</h3>
                <button class="modal-close-btn" onclick="toggleModal()">✕</button>
            </div>
            <div class="grid-map" id="gridMap"></div>
        </div>

        <!-- ====== MODAL: RESULT ====== -->
        <div class="modal result-modal" id="modalResult"
            style="display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.45);">
            <div class="result-box">
                <div class="result-title">📊 KẾT QUẢ BÀI THI</div>
                <div class="res-score" id="resScore">0</div>
                <div class="res-detail">
                    <div class="res-item correct-item"><b id="resRight">0</b>Đúng</div>
                    <div class="res-item wrong-item"><b id="resWrong">0</b>Sai</div>
                    <div class="res-item skip-item"><b id="resSkip">0</b>Bỏ qua</div>
                </div>
                <div id="resTime" class="res-time">Tổng thời gian: 00:00</div>

                <div class="result-actions">
                    <button class="result-btn primary" onclick="closeResult()">👁 Xem lại</button>
                    <button class="result-btn warning" onclick="resetExam()">🔄 Thi lại</button>
                    <button class="result-btn muted" onclick="goBack()">Thoát</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Nút Báo Lỗi Nổi (Ẩn mặc định) -->
    <button id="btnReportFloat" onclick="openReportModal()" style="display:none; position:fixed; bottom:80px; right:16px; background:linear-gradient(135deg,#FF6B6B,#EE5A24); color:white; border:none; padding:10px 16px; border-radius:25px; font-weight:bold; font-size:0.82em; box-shadow:0 6px 20px rgba(255,107,107,0.35); z-index:100; cursor:pointer; transition:0.3s;">
        ⚠️ Báo lỗi câu này
    </button>

    <!-- Modal Báo Lỗi -->
    <div class="modal" id="modalReport" style="display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.45); z-index:1000;">
        <div class="result-box" style="padding: 24px; text-align:left;">
            <div style="font-size:1.1em; font-weight:800; color:#d63031; margin-bottom:12px;">⚠️ Yêu cầu chỉnh lại câu</div>
            <p style="font-size:0.88em; color:#636e72; margin-bottom:10px;">Phát hiện sai sót? Điền yêu cầu chỉnh sửa:</p>
            <textarea id="reportContent" rows="4" style="width:100%; padding:12px; border-radius:12px; border:2px solid #EDF2F7; font-family:inherit; font-size:0.9em; resize:none; margin-bottom:15px; background:#F8F9FA;" placeholder="Ví dụ: Đáp án đúng phải là A, hoặc lỗi chính tả..."></textarea>
            
            <div style="display:flex; gap:10px;">
                <button class="result-btn primary" onclick="submitReport()" style="flex:1; background:#00B894;">Gửi</button>
                <button class="result-btn muted" onclick="document.getElementById('modalReport').style.display='none'" style="flex:1;">Hủy</button>
            </div>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/hihihaaaa.js"></script>
    <script src="js/tkhethan.js"></script>
    <script src="js/new2.js"></script>
    <script src="js/certificate.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        // KIỂM TRA ĐĂNG NHẬP
        const userData = sessionStorage.getItem('current_user');
        if (!userData) {
            alert("Bạn cần phải đăng nhập để làm bài!");
            window.location.href = "login.html";
        }

        const p = new URLSearchParams(window.location.search);
        const fid = p.get('id');

        // Đã gỡ logic lowGraphics nội bộ, chuyển qua cho new2.js xử lý toàn cục

        if (fid) {
            window.onload = () => loadExam(fid);
        } else {
            alert("Lỗi mã đề!"); window.location.href = "index.html";
        }
        function goBack() { window.location.href = `product.html?id=${fid}`; }

        // --- SMART REVIEW FILTER ---
        function closeResult() { 
            document.getElementById('modalResult').style.display = 'none'; 
            
            if (typeof isSubmitted !== 'undefined' && isSubmitted) {
                showReviewFilterBar();
            }
        }

        function showReviewFilterBar() {
            let filterBar = document.getElementById('reviewFilterBar');
            if (!filterBar) {
                filterBar = document.createElement('div');
                filterBar.id = 'reviewFilterBar';
                filterBar.style.cssText = `
                    display: flex; gap: 8px; margin-bottom: 15px; padding: 10px;
                    background: rgba(255, 255, 255, 0.9);
                    backdrop-filter: blur(10px);
                    border-radius: 12px;
                    justify-content: center; flex-wrap: wrap;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                    border: 1px solid rgba(255,255,255,0.5);
                    animation: fadeIn 0.5s;
                `;
                
                const quizArea = document.getElementById('quizArea');
                quizArea.insertBefore(filterBar, quizArea.firstChild);
            }
            
            filterBar.style.display = 'flex';
            filterBar.innerHTML = `
                <button onclick="applyReviewFilter('all')" class="filter-btn" id="filter-all" style="background:#0984e3; color:white; border:none; padding:6px 15px; border-radius:20px; cursor:pointer; font-weight:bold; transition:0.3s; box-shadow:0 4px 6px rgba(9,132,227,0.3);">Tất cả</button>
                <button onclick="applyReviewFilter('wrong')" class="filter-btn" id="filter-wrong" style="background:#e17055; color:white; border:none; padding:6px 15px; border-radius:20px; cursor:pointer; font-weight:bold; transition:0.3s; opacity:0.6;">❌ Câu sai</button>
                <button onclick="applyReviewFilter('skipped')" class="filter-btn" id="filter-skipped" style="background:#636e72; color:white; border:none; padding:6px 15px; border-radius:20px; cursor:pointer; font-weight:bold; transition:0.3s; opacity:0.6;">⚠️ Chưa làm</button>
                <button onclick="applyReviewFilter('bookmarked')" class="filter-btn" id="filter-bookmarked" style="background:#f1c40f; color:#2c3e50; border:none; padding:6px 15px; border-radius:20px; cursor:pointer; font-weight:bold; transition:0.3s; opacity:0.6;">🚩 Đã ghim</button>
            `;

            setupReviewObserver();
        }

        function applyReviewFilter(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.style.opacity = '0.6'; btn.style.boxShadow = 'none';
            });
            
            const activeBtn = document.getElementById('filter-' + type);
            if (activeBtn) {
                activeBtn.style.opacity = '1';
                let color = 'rgba(99,110,114,0.3)';
                if (type === 'all') color = 'rgba(9,132,227,0.3)';
                if (type === 'wrong') color = 'rgba(225,112,85,0.3)';
                if (type === 'bookmarked') color = 'rgba(241,196,15,0.5)';
                activeBtn.style.boxShadow = '0 4px 6px ' + color;
            }
            
            if (type === 'all') {
                isRetryMode = false;
            } else if (type === 'wrong') {
                isRetryMode = true;
                filteredQuestions = allQuestions.filter(q => q.firstAttemptSelected !== null && !q.isCorrectFirstTime);
                filteredQuestions.forEach((q, idx) => q.filteredIndex = idx);
            } else if (type === 'skipped') {
                isRetryMode = true;
                filteredQuestions = allQuestions.filter(q => q.firstAttemptSelected === null);
                filteredQuestions.forEach((q, idx) => q.filteredIndex = idx);
            } else if (type === 'bookmarked') {
                isRetryMode = true;
                let bms = [];
                try {
                    bms = JSON.parse(localStorage.getItem('bookmarks_' + currentFileName)) || [];
                } catch(e) {}
                filteredQuestions = allQuestions.filter(q => bms.includes(q.originalIndex));
                filteredQuestions.forEach((q, idx) => q.filteredIndex = idx);
            }
            
            currentIndex = 0;
            if (typeof renderQuestion === 'function') {
                if(isRetryMode && filteredQuestions.length === 0) {
                    document.getElementById('qText').innerHTML = '<div style="text-align:center; padding: 20px; font-weight:bold; color:#636e72">Không có câu hỏi nào trong mục này!</div>';
                    document.getElementById('optionsArea').innerHTML = '';
                    document.getElementById('qNumber').innerHTML = 'Lọc: 0 câu';
                    document.getElementById('btnPrev').disabled = true;
                    document.getElementById('btnNext').disabled = true;
                } else {
                    renderQuestion(0);
                }
            }
        }

        let obs = null;
        function setupReviewObserver() {
            if (obs) return;
            const target = document.getElementById('qNumber');
            obs = new MutationObserver(() => {
                // Sửa chữ "Làm lại lần" thành "Chế độ xem lại"
                if (typeof isSubmitted !== 'undefined' && isSubmitted && typeof isRetryMode !== 'undefined' && isRetryMode) {
                    const el = document.getElementById('qNumber');
                    if (el && el.innerHTML.includes('Làm lại lần')) {
                        el.innerHTML = el.innerHTML.replace(/Làm lại lần \d+/, 'Lọc câu hỏi');
                    }
                }
            });
            if(target) obs.observe(target, { childList: true, subtree: true });
            
            setInterval(() => {
                const fb = document.getElementById('reviewFilterBar');
                if (fb && typeof isSubmitted !== 'undefined' && !isSubmitted) {
                    fb.style.display = 'none';
                }
            }, 500);
        }

        // --- BÁO LỖI CÂU HỎI ---
        function openReportModal() {
            document.getElementById('modalReport').style.display = 'flex';
        }

        async function submitReport() {
            const text = document.getElementById('reportContent').value.trim();
            if (!text) return alert('Vui lòng nhập nội dung!');
            
            let qText = 'Không xác định';
            if (typeof allQuestions !== 'undefined' && typeof currentIndex !== 'undefined' && allQuestions[currentIndex]) {
                qText = allQuestions[currentIndex].text;
            }
            
            const ud = JSON.parse(sessionStorage.getItem('current_user') || '{}');
            const msg = `⚠️ <b>BÁO LỖI CÂU HỎI</b>\n👤 User: <code>${ud.username || 'Unknown'}</code>\n📚 Đề: ${typeof currentFileName !== 'undefined' ? currentFileName : 'N/A'}\n📍 Câu ${typeof currentIndex !== 'undefined' ? currentIndex + 1 : '?'}: ${qText.substring(0, 50)}...\n\n💬 <b>Nội dung góp ý:</b>\n${text}`;
            
            try {
                // Ensure api-config.js variables are available
                const token = typeof getTelegramBotToken === 'function' ? getTelegramBotToken() : '7709393354:AAGC5vNq2U8H7bYpMv29aE9_rZ5sY1G14vI';
                const chatId = typeof getTelegramChatId === 'function' ? getTelegramChatId() : '-4582962386';
                
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML' })
                });
                alert('Cảm ơn bạn đã góp ý! Yêu cầu đã được gửi đến ban quản trị.');
                document.getElementById('modalReport').style.display = 'none';
                document.getElementById('reportContent').value = '';
            } catch(e) {
                alert('Có lỗi xảy ra khi gửi yêu cầu.');
            }
        }

    </script>
    <script src="js/tet.js"></script>
    <script src="js/music.js"></script>
    <script src="js/no-refresh.js"></script>
</body>

</html>
