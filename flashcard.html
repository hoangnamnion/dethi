<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcards - Thẻ Ghi Nhớ | Hệ Thống Khảo Thí VIP 2026</title>
    <meta name="theme-color" content="#ffd23f">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 520px;
            min-height: 380px;
            height: 500px;
            max-height: calc(100vh - 220px);
            margin: 20px auto;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            border-radius: 28px;
        }

        .flashcard-container.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Để text bắt đầu từ trên xuống */
            padding: 35px 25px 35px 25px;
            border-radius: 28px;
            background: white;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
        }
        
        .flashcard-front::-webkit-scrollbar, .flashcard-back::-webkit-scrollbar {
            width: 6px;
        }
        .flashcard-front::-webkit-scrollbar-thumb, .flashcard-back::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 4px;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
            border: 2px solid #22c55e;
        }

        .q-text {
            font-size: 1.2em;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.6;
        }

        .a-text {
            font-size: 1.3em;
            font-weight: 800;
            color: #16a34a;
            line-height: 1.6;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8em;
            color: #94a3b8;
            font-weight: 600;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-btn {
            background: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .progress-label {
            font-weight: 800;
            color: #64748b;
            font-size: 1.1em;
        }

        .category-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <div class="container-box" style="padding-top: 60px;">
        <div style="position: absolute; top: 20px; left: 20px;">
            <button onclick="goBack()" style="background:none; border:none; font-size: 1.5em; cursor:pointer;">🔙</button>
        </div>
        <div style="position: absolute; top: 16px; right: 20px;">
            <button class="nav-btn btn-focus-theme-toggle" id="btnFlashcardThemeToggle" onclick="toggleFocusTheme()" style="background: #ffffff; border: 2px solid var(--neo-black); border-radius: 999px; box-shadow: 2px 2px 0 var(--neo-black); padding: 6px 14px; font-size: 0.82rem; font-weight: 800; cursor: pointer; width: auto; height: auto;" title="Đổi theme: Giảm màu mè tập trung ôn">
                <span class="theme-toggle-icon">🌱</span> <span class="theme-toggle-text">Giảm màu mè</span>
            </button>
        </div>

        <div class="big-title" style="margin-bottom: 5px;">HỌC THẺ GHI NHỚ</div>
        <div id="examName" style="font-weight: 700; color: #64748b; font-size: 0.9em; margin-bottom: 20px;">Đang tải...</div>

        <div class="flashcard-container" id="cardContainer" onclick="handleCardClick(event)">
            <div class="flashcard-inner">
                <div class="flashcard-front">
                    <div class="category-badge">CÂU HỎI</div>
                    <div class="q-text" id="qText">...</div>
                </div>
                <div class="flashcard-back">
                    <div class="category-badge" style="background: #dcfce7; color: #16a34a;">ĐÁP ÁN ĐÚNG</div>
                    <div class="a-text" id="aText">...</div>
                    <div class="hint">Bấm để quay lại câu hỏi 🔄</div>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <button class="nav-btn" id="btnPrev" title="Câu trước (←)" onclick="event.stopPropagation(); changeCard(-1)">👈</button>
            <button class="nav-btn" id="btnShuffle" title="Trộn câu hỏi" onclick="event.stopPropagation(); shuffleCards()" style="width: auto; padding: 0 16px; border-radius: 30px; font-size: 0.95rem; font-weight: 700;">🔀 Trộn</button>
            <div class="progress-label" id="progressLabel">0/0</div>
            <button class="nav-btn" id="btnNext" title="Câu sau (→)" onclick="event.stopPropagation(); changeCard(1)">👉</button>
        </div>

        <div style="margin-top: 30px; font-size: 0.85em; color: #94a3b8; line-height: 1.6; text-align: center;">
            Mẹo: Hãy tự trả lời trong đầu trước khi lật thẻ nhé! <br> Chúc bạn ôn thi tốt! ✨
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/flashcard.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const fileID = params.get('id') || 'KTCQ';
        const fileName = params.get('name') || fileID;

        document.getElementById('examName').innerText = fileName || ("Đề số " + fileID);

        function goBack() {
            window.location.href = `product.html?id=${fileID}&name=${encodeURIComponent(fileName)}`;
        }

        // Tải dữ liệu
        loadFlashcards(fileID);
    </script>
</body>
</html>
