<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Tài Khoản</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #667eea; color: white; font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        tr:hover { background-color: #f8f9fa; }
        .btn-refresh { display: block; width: max-content; margin: 0 auto; padding: 12px 30px; background: #2ecc71; color: white; text-align: center; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3); }
        .btn-refresh:hover { background: #27ae60; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(46, 204, 113, 0.4); }
        .links { margin-top: 30px; text-align: center; }
        .links a { color: #667eea; text-decoration: none; font-weight: bold; font-size: 16px; }
        .links a:hover { text-decoration: underline; }
        #loading { text-align: center; margin: 20px 0; font-style: italic; color: #7f8c8d; }
        .badge { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 20px; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bảng Quản Trị Hệ Thống 🛡️</h1>
    <button class="btn-refresh" onclick="loadAccounts()">🔄 Làm mới danh sách</button>
    
    <div id="loading">Đang tải dữ liệu từ server Pikamc... ⏳</div>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên Đăng Nhập</th>
                <th>Họ và Tên</th>
            </tr>
        </thead>
        <tbody id="accountTable">
            <!-- Dữ liệu từ server sẽ chui vào đây -->
        </tbody>
    </table>

    <div class="links">
        <a href="index.html">👈 Quay lại trang Đăng ký (Test)</a>
    </div>
</div>

<script>
    // Đã thay thế bằng link Cloudflare Worker xịn xò của bạn!
    const SERVER_URL = 'https://severtkdethi.caovannamutt.workers.dev/api/accounts';

    async function loadAccounts() {
        const tbody = document.getElementById('accountTable');
        const loading = document.getElementById('loading');
        
        tbody.innerHTML = '';
        loading.style.display = 'block';

        try {
            // Gửi dữ liệu GET để lấy danh sách
            const response = await fetch(SERVER_URL);
            const data = await response.json();
            
            loading.style.display = 'none';

            if (data.accounts && data.accounts.length > 0) {
                // Duyệt qua từng tài khoản và in ra HTML
                data.accounts.forEach(acc => {
                    const row = `<tr>
                        <td><span style="color:#888">#${acc.id}</span></td>
                        <td><strong>${acc.username}</strong></td>
                        <td>${acc.name || '<i style="color:#aaa">Không cung cấp</i>'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color:#888;">Chưa có tài khoản nào được lưu trên Server.</td></tr>';
            }
        } catch (error) {
            loading.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color:red;">❌ Lỗi kết nối tới Server Pikamc. Vui lòng kiểm tra lại xem server đã chạy chưa!</td></tr>';
            console.error('Lỗi kết nối:', error);
        }
    }

    // Tự động load danh sách ngay khi vừa vào trang
    window.onload = loadAccounts;
</script>

</body>
</html>
