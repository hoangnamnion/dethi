<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Chờ - PvP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/thi-premium.css">
    <script src="js/api-config.js"></script>
    <style>
        :root {
            --primary: #3b82f6; --danger: #ef4444; --bg: #0f172a; --panel: #1e293b;
        }
        body.low-graphics .mesh-bg { display: none !important; }
        body.low-graphics .falling-icon { display: none !important; }
        body.low-graphics canvas { display: none !important; }
        body.low-graphics * { animation: none !important; transition: none !important; }
        body.low-graphics { background: #0f172a !important; }
        
        /* Cấu trúc header/footer lấy từ thi-premium.css */
        .lobby-container {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 20px;
            flex-wrap: nowrap;
        }
        
        .slot {
            width: 260px; height: 360px; background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(255,255,255,0.15); border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; backdrop-filter: blur(15px); transition: 0.3s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); color: white;
        }
        
        .slot.occupied {
            border-color: #3b82f6; box-shadow: 0 0 30px rgba(59,130,246,0.4); background: rgba(15, 23, 42, 0.85);
        }
        
        .slot.ready {
            border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,0.4); background: rgba(15, 23, 42, 0.85);
        }

        .avatar {
            width: 100px; height: 100px; background: rgba(51,65,85,0.9); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 45px;
            margin-bottom: 25px; border: 4px solid #475569;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        
        .slot.ready .avatar {
            border-color: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.5);
        }

        .text-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%;
        }
        
        .name {
            font-size: 22px; font-weight: 800; color: white; margin-bottom: 15px; text-transform: uppercase;
            font-family: 'Montserrat', sans-serif; letter-spacing: 1px; text-align: center; word-break: break-word; padding: 0 10px;
        }
        
        .status-badge {
            padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; background: #64748b; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .slot.ready .status-badge {
            background: #22c55e; box-shadow: 0 0 10px #22c55e;
        }

        .btn-invite {
            background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4);
            width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 45px; color: rgba(255,255,255,0.7); cursor: pointer; transition: 0.3s;
        }
        .btn-invite:hover {
            background: rgba(255,255,255,0.2); border-color: white; color: white; transform: scale(1.1);
        }

        .vs-badge {
            font-size: 45px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 20px rgba(251,191,36,0.6);
            animation: pulse 1s infinite alternate; font-family: 'Montserrat', sans-serif;
            margin: 0 20px; z-index: 10;
        }

        .footer {
            padding: 40px; text-align: center; display: flex; justify-content: center;
        }
        .btn-ready.is-ready {
            background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 10px 20px rgba(34,197,94,0.4);
        }

        @keyframes pulse { from {transform: scale(1);} to {transform: scale(1.1);} }

        /* Modal Mời */
        #inviteModal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .invite-box {
            background: #1e293b; width: 90%; max-width: 450px; padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .invite-box h3 {
            margin-top: 0; color: white; display: flex; justify-content: space-between; align-items: center;
            font-family: 'Montserrat', sans-serif; font-size: 1.3em;
        }
        .invite-item {
            display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05);
            padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        .invite-item span {
            color: white; font-weight: 600; font-size: 1.1em;
        }
        .btn-send-invite {
            background: #ef4444; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .btn-send-invite:hover {
            background: #dc2626; transform: scale(1.05);
        }
        
        @media (max-width: 700px) {
            .header { padding: 15px 10px; }
            .header-title { font-size: 16px !important; }
            .footer { padding: 15px; }
            .submit-btn-new { width: 100%; max-width: 300px; padding: 12px !important; font-size: 16px !important; }
            
            .lobby-container {
                flex-direction: column;
                gap: 15px;
                padding: 10px;
            }
            .slot {
                width: 100%;
                max-width: 340px;
                height: 110px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 20px;
                gap: 20px;
            }
            .avatar {
                width: 70px; height: 70px; font-size: 35px; margin-bottom: 0;
            }
            .name {
                font-size: 18px; margin-bottom: 8px; text-align: left; padding: 0;
            }
            .status-badge {
                padding: 4px 12px; font-size: 12px;
            }
            .vs-badge {
                font-size: 30px; margin: 0;
            }
            .btn-invite {
                width: 70px; height: 70px; font-size: 35px;
            }
            /* Flex layout for content inside slots */
            #slotHost {
                justify-content: flex-start;
            }
            .text-wrapper {
                align-items: flex-start; justify-content: center;
            }
            
            /* Ghi đè inline style của guestContent */
            #guestContent {
                flex-direction: row !important;
                align-items: center !important;
                width: 100%;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <div class="app-full">
        <!-- ====== HEADER ====== -->
        <div class="header exam-header">
            <button class="home-btn" onclick="exitLobby()" title="Thoát phòng">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>

            <div class="header-center">
                <div class="header-title" style="color: #fbbf24; font-weight: 900; letter-spacing: 2px;">⚔️ PHÒNG CHỜ ⚔️</div>
                <div class="header-timer" id="examInfo">Đang tải thông tin đề...</div>
            </div>

            <div class="header-actions">
                <div style="width: 40px;"></div>
            </div>
        </div>

        <div class="content" style="display:flex; flex-direction:column; overflow-y:auto; padding-top: 0;">
            <div class="lobby-container">
            <!-- Slot Host -->
            <div class="slot occupied" id="slotHost">
                <div class="avatar">👑</div>
                <div class="text-wrapper">
                    <div class="name" id="hostName">...</div>
                    <div class="status-badge" id="hostStatus">Đang chờ</div>
                </div>
            </div>

            <div class="vs-badge">VS</div>

            <!-- Slot Guest -->
            <div class="slot" id="slotGuest">
                <div class="btn-invite" id="btnInvite" onclick="openInviteModal()">+</div>
                
                <div id="guestContent" style="display:none; flex-direction:column; align-items:center;">
                    <div class="avatar">🔥</div>
                    <div class="text-wrapper guest-text-wrapper">
                        <div class="name" id="guestName">...</div>
                        <div class="status-badge" id="guestStatus">Đang chờ</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== FOOTER ====== -->
        <div class="footer exam-footer" style="justify-content: center;">
            <button class="submit-btn-new" id="btnReady" onclick="toggleReady()" style="padding: 15px 60px; font-size: 20px; font-weight: 900; letter-spacing: 1px;">SẴN SÀNG</button>
        </div>
    </div>

    <!-- Modal Mời -->
    <div id="inviteModal">
        <div class="invite-box">
            <h3>
                Mời Người Chơi
                <button onclick="closeInviteModal()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:24px; transition: 0.2s;">✕</button>
            </h3>
            <div id="onlineList" style="max-height:350px; overflow-y:auto; padding-right: 5px; margin-top: 20px;">
                <div style="color:#64748b; text-align:center;">Đang tải...</div>
            </div>
        </div>
    </div>

    <script src="js/hihihaaaa.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const fileId = urlParams.get('file') || '';
        const fileName = urlParams.get('filename') || '';

        let currentUser = null;
        try {
            const ud = sessionStorage.getItem('current_user');
            if (ud) currentUser = JSON.parse(ud).username || JSON.parse(ud).accountId;
        } catch(e){}

        if (!currentUser) {
            alert("Vui lòng đăng nhập!");
            window.location.href = "index.html";
        }
        if (!roomId) {
            alert("Lỗi: Không tìm thấy phòng!");
            window.location.href = "index.html";
        }

        document.getElementById('examInfo').innerText = "Đề thi: " + (fileName || fileId || "Đang tải...");

        let isHost = false;
        let isReady = false;
        let pollInterval = null;
        let roomData = null;

        fetch(API_BASE + "?action=joinRoom&room=" + encodeURIComponent(roomId) + "&user=" + encodeURIComponent(currentUser))
            .then(r => r.json())
            .then(res => {
                if (res.success || res.error === 'Phòng đã đầy') {
                    startPolling();
                } else {
                    alert("Lỗi: " + res.error);
                    window.location.href = "index.html";
                }
            });

        function startPolling() {
            pollInterval = setInterval(fetchRoomInfo, 1000);
        }

        function fetchRoomInfo() {
            fetch(API_BASE + "?action=getRoomInfo&room=" + encodeURIComponent(roomId))
                .then(r => r.json())
                .then(res => {
                    if (res.success && res.room) {
                        roomData = res.room;
                        updateUI();
                        
                        if (roomData.status === 'playing') {
                            clearInterval(pollInterval);
                            const opp = (currentUser === roomData.host) ? roomData.guest : roomData.host;
                            window.location.href = `pvp.html?room=${encodeURIComponent(roomId)}&opponent=${encodeURIComponent(opp)}&file=${encodeURIComponent(roomData.fileId || '')}`;
                        }
                    }
                });
        }

        function getAvatarHTML(username) {
            let avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(username)}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;
            if (username === currentUser) {
                try {
                    const ud = sessionStorage.getItem('current_user');
                    if (ud) {
                        const accountId = JSON.parse(ud).accountId;
                        const saved = localStorage.getItem('profile_avatar_' + accountId);
                        if (saved) avatarUrl = saved;
                    }
                } catch(e){}
            }
            return `<img src="${avatarUrl}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
        }

        function updateUI() {
            if (!roomData) return;
            
            isHost = (currentUser === roomData.host);
            
            document.getElementById('hostName').innerText = roomData.host;
            document.querySelector('#slotHost .avatar').innerHTML = getAvatarHTML(roomData.host);
            
            if (roomData.hostReady) {
                document.getElementById('slotHost').classList.add('ready');
                document.getElementById('hostStatus').innerText = "Đã Sẵn Sàng";
            } else {
                document.getElementById('slotHost').classList.remove('ready');
                document.getElementById('hostStatus').innerText = "Đang chờ";
            }

            const guestSlot = document.getElementById('slotGuest');
            if (roomData.guest) {
                document.getElementById('btnInvite').style.display = 'none';
                document.getElementById('guestContent').style.display = 'flex';
                guestSlot.classList.add('occupied');
                document.getElementById('guestName').innerText = roomData.guest;
                document.querySelector('#guestContent .avatar').innerHTML = getAvatarHTML(roomData.guest);
                
                if (roomData.guestReady) {
                    guestSlot.classList.add('ready');
                    document.getElementById('guestStatus').innerText = "Đã Sẵn Sàng";
                } else {
                    guestSlot.classList.remove('ready');
                    document.getElementById('guestStatus').innerText = "Đang chờ";
                }
            } else {
                document.getElementById('btnInvite').style.display = 'flex';
                document.getElementById('guestContent').style.display = 'none';
                guestSlot.classList.remove('occupied', 'ready');
            }

            if (!isHost) document.getElementById('btnInvite').style.display = 'none';

            const myReady = isHost ? roomData.hostReady : roomData.guestReady;
            const btn = document.getElementById('btnReady');
            if (myReady) {
                btn.classList.add('is-ready');
                btn.innerText = isHost ? "HỦY CHIẾN ĐẤU" : "HỦY SẴN SÀNG";
            } else {
                btn.classList.remove('is-ready');
                btn.innerText = isHost ? "CHIẾN ĐẤU" : "SẴN SÀNG";
            }
        }

        function toggleReady() {
            if (isHost && !roomData.guest) {
                alert("Hãy mời người khác vào phòng trước!");
                return;
            }
            fetch(API_BASE + "?action=toggleReady&room=" + encodeURIComponent(roomId) + "&user=" + encodeURIComponent(currentUser));
        }

        function openInviteModal() {
            document.getElementById('inviteModal').style.display = 'flex';
            loadOnlineUsers();
        }
        function closeInviteModal() {
            document.getElementById('inviteModal').style.display = 'none';
        }
        
        async function loadOnlineUsers() {
            try {
                const response = await fetch(API_BASE + "?action=getOnlineUsers&t=" + Date.now());
                const data = await response.json();
                let listHTML = '';
                const onlineUsers = Array.isArray(data) ? data : (data.users || []);

                const others = onlineUsers.filter(u => {
                    const uName = (typeof u === 'object') ? (u.name || u.username) : u;
                    return uName !== currentUser;
                });

                if (others.length > 0) {
                    listHTML = others.map(u => {
                        const displayName = (typeof u === 'object') ? (u.name || u.username || '?') : u;
                        return `
                        <div class="invite-item">
                            <span>${displayName}</span>
                            <button class="btn-send-invite" id="btn-inv-${displayName}" onclick="sendInvite('${displayName}')">Mời</button>
                        </div>`;
                    }).join('');
                } else {
                    listHTML = `<div style="color:#94a3b8; text-align:center; padding: 20px; font-weight: 500;">Không có ai đang rảnh</div>`;
                }
                document.getElementById('onlineList').innerHTML = listHTML;
            } catch (e) {
                document.getElementById('onlineList').innerHTML = `<div style="color:red; text-align:center;">Lỗi tải danh sách</div>`;
            }
        }

        function sendInvite(targetUser) {
            const btn = document.getElementById('btn-inv-' + targetUser);
            if(btn) { btn.innerText = "Đã mời"; btn.disabled = true; btn.style.background = "#f59e0b"; }
            
            fetch(API_BASE + "?action=sendChallenge&from=" + encodeURIComponent(currentUser) + "&to=" + encodeURIComponent(targetUser) + "&room=" + encodeURIComponent(roomId) + "&file=" + encodeURIComponent(fileId) + "&filename=" + encodeURIComponent(fileName))
                .catch(e => { alert("Lỗi mạng!"); });
        }

        function exitLobby() {
            if (confirm("Bạn có chắc chắn muốn thoát khỏi phòng chờ?")) {
                // Có thể thêm API rời phòng tại đây nếu cần:
                // fetch(API_BASE + "?action=leaveRoom&room=" + encodeURIComponent(roomId) + "&user=" + encodeURIComponent(currentUser));
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
